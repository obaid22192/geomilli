          example: local

    ErrorDetail:
      type: object
      required:
        - code
        - message
        - status
      properties:
        code:
          type: string
          enum:
            - missing_parameter
            - invalid_parameter
            - invalid_body
            - not_found
            - upstream_unavailable
            - internal_error
            - unauthorized
          description: Machine-readable error code per RFC-001 §11.2
          example: invalid_parameter
        message:
          type: string
          description: Human-readable error description
          example: Parameter 'lat' must be between -90 and 90
        status:
          type: integer
          description: HTTP status code
          example: 400

